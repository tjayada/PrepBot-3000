<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepBot-3000 - Public Analysis Table</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/components/opponent-analysis-table.css">
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />
    <meta name="theme-color" content="#2c3e50" />
    
</head>
<body>

    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <h1 id="page-title">Public Analysis Database</h1>
            <div class="nav-buttons">
                <a href='/' class="btn btn--neutral">Home</a>
                <a href='/dashboard' id="dashboard-link" class="btn btn--primary" style="display: none;">Dashboard</a>
                <a href='/public_table' class="btn btn--primary">Public Table</a>
                <button id="auth-button" class="btn btn--neutral"></button>
            </div>
        </div>
        
        <!-- Public Content -->
        <div class="public-content-wrapper">
            <!--
            <div class="page-header">
                <h2>Explore all chess opponent analysis from the PrepBot-3000 community</h2>
            </div>
            -->
        
        <!-- Stats Grid -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-analyses">-</div>
                <div class="stat-label">Total Analyses</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unique-opponents">-</div>
                <div class="stat-label">Unique Opponents</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unique-users">-</div>
                <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="recent-analyses">-</div>
                <div class="stat-label">Last 24 Hours</div>
            </div>
        </div>
        
        <!-- Loading State -->
        <div id="loading" class="loading">
            <p>Loading public analysis data...</p>
        </div>
        
        <!-- Error State -->
        <div id="error" class="error" style="display: none;">
            <p id="error-message"></p>
        </div>
        
            <!-- Component Container -->
            <div id="analysis-container"></div>
        </div>
    </div>

    <!-- Chessboard Background -->
    <div class="chessboard" id="chessboard"></div>

    <script src="/components/opponent-analysis-table.js"></script>
    <script src="/script.js"></script>
    <script>
        // Public Analysis Table Component (extends OpponentAnalysisTable)
        class PublicAnalysisTable extends OpponentAnalysisTable {
            constructor(containerId, options = {}) {
                super(containerId, options);
            }
            
            async loadData() {
                try {
                    this.showLoading();
                    this.hideError();
                    
                    console.log('Loading public analysis data...');
                    
                    const response = await fetch(`${this.options.apiBaseUrl}/api/public/analysis`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        console.log('Public analysis data:', data.analysis_history);
                        this.displayData(data.analysis_history);
                        
                        if (this.options.onDataLoad) {
                            this.options.onDataLoad(data.analysis_history);
                        }
                    } else {
                        this.showError(data.error || 'Failed to load public analysis data');
                    }

                } catch (error) {
                    console.error('Error loading public analysis data:', error);
                    this.showError('Network error. Please check your connection.');
                }
            }
            
            createTableRow(analysis) {
                const row = document.createElement('tr');
                
                // Format date
                const date = new Date(analysis.created_at);
                const formattedDate = date.toLocaleDateString(); //+ ' ' + date.toLocaleTimeString();
                
                // Create color display
                const colorDisplay = analysis.color === 'white' ? 'White ♔' : 'Black ♚';
                const colorClass = analysis.color === 'white' ? 'white' : 'black';
                
                row.innerHTML = `
                    <td class="date-cell">${formattedDate}</td>
                    <td class="opponent-cell">${analysis.opponent}</td>
                    <td class="color-cell ${colorClass}">${colorDisplay}</td>
                    <td class="prep-cell">${analysis.preparation}</td>
                `;
                
                return row;
            }
            
        }
        
        // API Configuration
        const API_BASE_URL = window.API_BASE_URL;
        
        // Global variables
        let analysisTable = null;
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            checkLogin();
            initializeAnalysisTable();
        });
        
        // logout() provided globally in script.js
        
        function initializeAnalysisTable() {
            // Hide loading
            document.getElementById('loading').style.display = 'none';
            
            // Initialize the component with public API
            analysisTable = new PublicAnalysisTable('analysis-container', {
                title: 'Public Analysis History',
                pageSize: 5,
                showControls: true,
                apiBaseUrl: API_BASE_URL,
                onDataLoad: function(data) {
                    console.log('Public analysis data loaded:', data.length, 'entries');
                    updateStats(data);
                },
                onError: function(error) {
                    console.error('Component error:', error);
                    showError(error);
                }
            });
            
            // Auto-load data
            analysisTable.loadData();
        }
        
        function updateStats(data) {
            if (!data || data.length === 0) {
                document.getElementById('total-analyses').textContent = '0';
                document.getElementById('unique-opponents').textContent = '0';
                document.getElementById('unique-users').textContent = '0';
                document.getElementById('recent-analyses').textContent = '0';
                return;
            }
            
            // Calculate stats
            const totalAnalyses = data.length;
            const uniqueOpponents = new Set(data.map(item => item.opponent)).size;
            const uniqueUsers = new Set(data.map(item => item.created_by)).size;
            
            // Count analyses from last 24 hours
            const now = new Date();
            const oneDayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
            const recentAnalyses = data.filter(item => new Date(item.created_at) > oneDayAgo).length;
            
            // Update stats display
            document.getElementById('total-analyses').textContent = totalAnalyses.toLocaleString();
            document.getElementById('unique-opponents').textContent = uniqueOpponents.toLocaleString();
            document.getElementById('unique-users').textContent = uniqueUsers.toLocaleString();
            document.getElementById('recent-analyses').textContent = recentAnalyses.toLocaleString();
        }
        
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = message;
        }
        
        function hideError() {
            document.getElementById('error').style.display = 'none';
        }
        
        
        // Global function to refresh data (can be called from console for testing)
        window.refreshAnalysis = function() {
            if (analysisTable) {
                analysisTable.refreshData();
            }
        };
        
        // Global function to get current data (for debugging)
        window.getAnalysisData = function() {
            if (analysisTable) {
                return analysisTable.getData();
            }
            return null;
        };

        async function checkLogin() {
            const authButton = document.getElementById('auth-button');
            const dashboardLink = document.getElementById('dashboard-link');

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/status`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                let isAuthenticated = false;
                if (response.ok) {
                    const data = await response.json();
                    if (data.authenticated) {
                        isAuthenticated = true;
                    }
                }

                if (isAuthenticated) {
                    // User is logged in
                    if (dashboardLink) dashboardLink.style.display = 'inline-block';
                    if (authButton) {
                        authButton.textContent = 'Logout';
                        authButton.className = 'btn btn--danger';
                        authButton.onclick = logout;
                    }
                } else {
                    // User is not logged in
                    if (dashboardLink) dashboardLink.style.display = 'none';
                    if (authButton) {
                        authButton.textContent = 'Login';
                        authButton.className = 'btn btn--success';
                        authButton.onclick = () => {
                            window.location.href = `${API_BASE_URL}/auth/login`;
                        };
                    }
                }
            }
            catch (error) {
                // If there's an error, assume not logged in
                console.error('Auth check failed:', error);
                if (dashboardLink) dashboardLink.style.display = 'none';
                if (authButton) {
                    authButton.textContent = 'Login';
                    authButton.className = 'btn btn--success';
                    authButton.onclick = () => {
                        window.location.href = `${API_BASE_URL}/auth/login`;
                    };
                }
            }
        }
    </script>
</body>
</html>
