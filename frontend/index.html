<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lichess Scout</title>
  <link rel="stylesheet" href="/css/styles.css">
  <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">-->
  <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">-->
</head>

<body>

  <!--Display the main content in the center of the page-->
  <div class="main-content">
      <h1>Lichess Scout</h1>
      <h3>Prep Like A GM In 30 Seconds Or Less</h3>
      <a id="login-button" href="#" style="margin-top: 20px; display: inline-block">Login with Lichess</a>
      <div style="margin-top: 30px;">
        <a href="/public_table" style="margin-top: 20px; display: inline-block; background: #3498db; color: white; transition: background-color 0.3s;">
          View Public Analysis Database
        </a>
      </div>
  </div>
  
  <script>
    // API Configuration - will be set by the server or environment
    const API_BASE_URL = window.location.origin.replace(':3000', ':8000'); 
    
    // Set the login button href dynamically
    document.getElementById('login-button').href = `${API_BASE_URL}/auth/login`;

    // Check if the user is logged in and show dashboard instead of login page if user is logged in
    async function checkLogin() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/status`, {
          method: 'GET',
          credentials: 'include',
          headers: {
                        'Content-Type': 'application/json'
                    }
        });
        const data = await response.json();
        if (data.authenticated) {
          // User is logged in
          window.location.href = '/dashboard';
        }
      }
      catch (error) {
        // If there's an error, assume not logged in and do nothing.
        // The user stays on the login page.
        console.error('Auth check failed:', error);
      }
      }

      checkLogin();
          

  </script>  
  
  <!--Display the chess background on inactivity-->
  <div class="chessboard" id="chessboard"></div>
  <script src="script.js"></script>

</body>

</html>
